# Typical commercial-bank criteria for SME term financing in Saudi Arabia.
# Every rule names its source. `assumption: true` marks thresholds we chose
# because the public source states the criterion but not a number.
id: commercial_bank_sme
name: Commercial bank · SME term financing
description: >
  Typical commercial-bank criteria for SME financing. The ready threshold (75)
  is our own calibration, not a published bank figure.
ready_threshold: 75

rules:
  - id: CR_INVALID
    check: cr_valid
    severity: hard
    weight: 10
    message: "Commercial registration is not active or has expired."
    source: "Lendo — Business financing requirements in Saudi Arabia: CR must be valid and active"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia

  - id: CR_EXPIRING
    check: cr_not_expiring
    severity: hard
    weight: 5
    params: {min_days: 90}
    message: "Commercial registration expires in {days_left} days; lenders expect at least {min_days}."
    source: "Lendo — CR must not be close to expiry (no duration stated)"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia
    assumption: true

  - id: HISTORY_SHORT
    check: min_operating_history
    severity: hard
    weight: 10
    params: {min_months: 24}
    message: "Business has {operating_months} months of history; this lender expects {min_months}."
    source: "Lendo — commercial banks often require two to three years of operation"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia

  - id: ACTIVE_DEFAULTS
    check: no_active_defaults
    severity: hard
    weight: 15
    message: "Credit record shows active defaults or unresolved disputes."
    source: "Lendo — no active defaults, unresolved disputes or pending legal proceedings"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia

  - id: DSCR_LOW
    check: dscr_min
    severity: hard
    weight: 20
    params: {min_dscr: 1.2}
    message: >-
      Repayment coverage is {dscr} (needs {min_dscr}). At current cash flow the business
      can service about SAR {max_affordable_sar:,.0f}, not the SAR {requested_sar:,.0f} requested.
    source: "Lendo — debt service coverage ratio consistently above 1.2 is generally considered healthy"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia

  - id: CASHFLOW_VOLATILE
    check: cashflow_consistency
    severity: soft
    weight: 10
    params: {max_cv: 0.35, max_zero_months: 0}
    message: "Monthly revenue is irregular (variation {revenue_cv}, limit {max_cv}; {zero_months} months with no revenue)."
    source: "Lendo — consistent cash flows over the 12 months before applying (no threshold stated)"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia
    assumption: true

  - id: EINVOICING
    check: flag
    severity: hard
    weight: 10
    params: {field: einvoicing_compliant}
    message: "E-invoicing (ZATCA) is not compliant."
    source: "Qoyod — SME financing in Saudi Arabia 2026: compliant e-invoicing is a readiness element"
    source_url: https://www.qoyod.com/en/reports/saudi-sme-financing-2026/

  - id: VAT_LATE
    check: flag
    severity: soft
    weight: 5
    params: {field: vat_filed_on_time}
    message: "VAT returns have not been filed on time."
    source: "Qoyod — VAT returns filed on time"
    source_url: https://www.qoyod.com/en/reports/saudi-sme-financing-2026/

  - id: STATEMENTS_MISSING
    check: flag
    severity: soft
    weight: 5
    params: {field: financial_statements_available}
    message: "No regular financial statements (income statement and balance sheet) for consecutive periods."
    source: "Qoyod — regular financial statements across consecutive periods"
    source_url: https://www.qoyod.com/en/reports/saudi-sme-financing-2026/

  - id: ACCOUNTS_MIXED
    check: flag
    severity: soft
    weight: 5
    params: {field: separate_business_account}
    message: "Business and personal finances are mixed in one account."
    source: "Qoyod — keep business and personal finances separate"
    source_url: https://www.qoyod.com/en/reports/saudi-sme-financing-2026/

  - id: NO_SECURITY
    check: security
    severity: hard
    weight: 10
    message: "No collateral and no Kafalah guarantee."
    source: "Lendo — banks require collateral; Qoyod — Kafalah addresses a shortage of physical collateral"
    source_url: https://www.qoyod.com/en/reports/saudi-sme-financing-2026/

  - id: RECEIVABLES_OVERDUE
    check: receivables_overdue
    severity: soft
    weight: 5
    params: {max_ratio: 0.30}
    message: "{overdue_ratio:.0%} of receivables are more than 90 days overdue (SAR {overdue_sar:,.0f})."
    source: "Qoyod — a consistent record of collecting from customers is part of repayment capacity (no threshold stated)"
    source_url: https://www.qoyod.com/en/reports/saudi-sme-financing-2026/
    assumption: true

  - id: NOT_SME
    check: is_sme
    severity: hard
    weight: 5
    message: "Annual revenue is above the SME range, so SME programs such as Kafalah do not apply."
    source: "Qoyod citing Monsha'at — SMEs have annual revenue up to SAR 200 million"
    source_url: https://www.qoyod.com/en/reports/saudi-sme-financing-2026/
