# Typical criteria of a SAMA-licensed digital lender financing SMEs against
# invoices. Used to test that the agent adapts when the lender changes.
# Modelled on publicly stated criteria; not any one company's internal policy.
id: digital_lender_invoice
name: Digital lender · invoice-backed financing
name_ar: ممول رقمي · تمويل مقابل الفواتير
description: >
  Shorter history required and no collateral, but a minimum revenue and a
  stricter view on overdue receivables. The ready threshold (70) is our own
  calibration.
ready_threshold: 70

rules:
  - id: CR_INVALID
    check: cr_valid
    severity: hard
    weight: 10
    message: "Commercial registration is not active or has expired."
    source: "Lendo — CR covers the financed activity and is neither expired nor restricted"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia

  - id: CR_EXPIRING
    check: cr_not_expiring
    severity: hard
    weight: 5
    params: {min_days: 60}
    message: "Commercial registration expires in {days_left} days; this lender expects at least {min_days}."
    source: "Lendo — CR must not be close to expiry (no duration stated)"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia
    assumption: true

  - id: HISTORY_SHORT
    check: min_operating_history
    severity: hard
    weight: 10
    params: {min_months: 12}
    message: "Business has {operating_months} months of history; this lender expects {min_months}."
    source: "Lendo — at least one year of operation with documented financial activity"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia

  - id: REVENUE_LOW
    check: min_annual_revenue
    severity: hard
    weight: 15
    params: {min_sar: 2000000}
    message: "Annual revenue is SAR {annual_revenue_sar:,.0f}; this lender requires at least SAR {min_sar:,.0f}."
    source: "Lendo — annual revenues of at least SAR 2,000,000"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia

  - id: ACTIVE_DEFAULTS
    check: no_active_defaults
    severity: hard
    weight: 15
    message: "Credit record shows active defaults or unresolved disputes."
    source: "Lendo — no active defaults or unresolved legal disputes"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia

  - id: DSCR_LOW
    check: dscr_min
    severity: hard
    weight: 15
    params: {min_dscr: 1.2}
    message: >-
      Repayment coverage is {dscr} (needs {min_dscr}). At current cash flow the business
      can service about SAR {max_affordable_sar:,.0f}, not the SAR {requested_sar:,.0f} requested.
    source: "Lendo — debt service coverage ratio consistently above 1.2"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia

  - id: CASHFLOW_VOLATILE
    check: cashflow_consistency
    severity: soft
    weight: 10
    params: {max_cv: 0.40, max_zero_months: 1}
    message: "Monthly revenue is irregular (variation {revenue_cv}, limit {max_cv}; {zero_months} months with no revenue)."
    source: "Lendo — regular, consistent cash flows (no threshold stated)"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia
    assumption: true

  - id: RECEIVABLES_OVERDUE
    check: receivables_overdue
    severity: hard
    weight: 10
    params: {max_ratio: 0.20}
    message: "{overdue_ratio:.0%} of receivables are more than 90 days overdue (SAR {overdue_sar:,.0f}); invoice-backed financing needs creditworthy debtors."
    source: "Lendo — verified invoices owed by creditworthy debtors; low debtor creditworthiness is a rejection trigger"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia
    assumption: true

  - id: EINVOICING
    check: flag
    severity: hard
    weight: 10
    params: {field: einvoicing_compliant}
    message: "E-invoicing (ZATCA) is not compliant, so invoices cannot be verified."
    source: "Qoyod — compliant e-invoicing; Lendo — invoices must be verified"
    source_url: https://www.qoyod.com/en/reports/saudi-sme-financing-2026/

  - id: ACCOUNTS_MIXED
    check: flag
    severity: soft
    weight: 5
    params: {field: separate_business_account}
    message: "Business and personal finances are mixed in one account."
    source: "Lendo — business account kept separate from personal finances"
    source_url: https://www.lendo.sa/en/blog/business-financing-requirements-in-saudi-arabia
